version: "3"

includes:
  local: ./Taskfile_{{OS}}.yml

env:
  GOPRIVATE: "gitlab.dit.htwk-leipzig.de/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart"
  LPATH: "{{.BIN_PATH}}:{{.PATH}}"

vars:
  VERSION: '{{now | date "15-04-05"}}-debug'
  MODULE_NAME: "gitlab.dit.htwk-leipzig.de/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart"
  OPENAI_KEY_VAR: "{{.MODULE_NAME}}/internal/build.OpenAIKey"
  AWS_ACCESS_KEY_VAR: "{{.MODULE_NAME}}/internal/build.AwsAccessKey"
  AWS_SECRET_ACCESS_KEY_VAR: "{{.MODULE_NAME}}/internal/build.AwsSecretAccessKey"
  VERSION_VAR: "{{.MODULE_NAME}}/internal/build.Version"

tasks:
  setup:
    desc: "Setup the project"
    cmds:
      - git config core.hooksPath githooks
      - go mod tidy
      - PATH=$LPATH; doppler login
      - PATH=$LPATH; doppler setup -c dev -p htwk-projekt

  build:
    desc: "Build the project"
    deps: [generate]
    vars:
      OPENAI_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get OPENAI_KEY --plain"
      AWS_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_ACCESS_KEY_ID --plain"
      AWS_SECRET_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_SECRET_ACCESS_KEY --plain"
    cmds:
      - echo "building suproxy with version {{.VERSION}}"
      - cmd: go build -o build/suproxy -ldflags "-X '{{.VERSION_VAR}}={{.VERSION}}' -X '{{.OPENAI_KEY_VAR}}={{.OPENAI_KEY}}' -X '{{.AWS_ACCESS_KEY_VAR}}={{.AWS_ACCESS_KEY}}' -X '{{.AWS_SECRET_ACCESS_KEY_VAR}}={{.AWS_SECRET_ACCESS_KEY}}'" ./cmd/suproxy/
        platforms: [linux, darwin]
      - echo "building autotester with version {{.VERSION}}"
      - cmd: go build -o build/autotester -ldflags "-X '{{.VERSION_VAR}}={{.VERSION}}' -X '{{.OPENAI_KEY_VAR}}={{.OPENAI_KEY}}' -X '{{.AWS_ACCESS_KEY_VAR}}={{.AWS_ACCESS_KEY}}' -X '{{.AWS_SECRET_ACCESS_KEY_VAR}}={{.AWS_SECRET_ACCESS_KEY}}'" ./cmd/autotester/
        platforms: [linux, darwin]
      - echo "building suproxy.exe with version {{.VERSION}}"
      - cmd: go build -o build/suproxy.exe -ldflags "-X '{{.VERSION_VAR}}={{.VERSION}}' -X '{{.OPENAI_KEY_VAR}}={{.OPENAI_KEY}}' -X '{{.AWS_ACCESS_KEY_VAR}}={{.AWS_ACCESS_KEY}}' -X '{{.AWS_SECRET_ACCESS_KEY_VAR}}={{.AWS_SECRET_ACCESS_KEY}}'" ./cmd/suproxy/
        platforms: [windows/amd64]
      - echo "building autotester.exe with version {{.VERSION}}"
      - cmd: go build -o build/autotester.exe -ldflags "-X '{{.VERSION_VAR}}={{.VERSION}}' -X '{{.OPENAI_KEY_VAR}}={{.OPENAI_KEY}}' -X '{{.AWS_ACCESS_KEY_VAR}}={{.AWS_ACCESS_KEY}}' -X '{{.AWS_SECRET_ACCESS_KEY_VAR}}={{.AWS_SECRET_ACCESS_KEY}}'" ./cmd/autotester/
        platforms: [windows/amd64]
    silent: true
  
  build-frontend:
    cmds:
      - cd web/ && pnpm install
      - task: lint-frontend
      - cd web/ && pnpm run build
    sources:
      - web/*

  build-frontend-dev:
    desc: "Build the frontend"
    dir: "web"
    cmds:
      - pnpm build
    sources:
      - web/*

  build-pipeline:
    desc: "Use in build job of pipeline to make production build binaries"
    vars:
      BUILD_BRANCH:
        sh: git rev-parse --abbrev-ref HEAD
      BUILD_DATE:
        sh: date +"%Y-%m-%d-%H:%M:%S"
      VERSION: "{{.BUILD_BRANCH}}-{{.BUILD_DATE}}"
      OPENAI_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get OPENAI_KEY --plain"
      AWS_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_ACCESS_KEY_ID --plain"
      AWS_SECRET_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_SECRET_ACCESS_KEY --plain"
    cmds:
      - echo "building suproxy with version {{.VERSION}}"
      - CGO_ENABLED=0 go build -o build/suproxy -ldflags "-s -w -X '{{.VERSION_VAR}}={{.VERSION}}' -X '{{.OPENAI_KEY_VAR}}={{.OPENAI_KEY}}' -X '{{.AWS_ACCESS_KEY_VAR}}={{.AWS_ACCESS_KEY}}' -X '{{.AWS_SECRET_ACCESS_KEY_VAR}}={{.AWS_SECRET_ACCESS_KEY}}'" ./cmd/suproxy/
      - echo "building autotester with version {{.VERSION}}"
      - CGO_ENABLED=0 go build -o build/autotester -ldflags "-s -w -X '{{.VERSION_VAR}}={{.VERSION}}' -X '{{.OPENAI_KEY_VAR}}={{.OPENAI_KEY}}' -X '{{.AWS_ACCESS_KEY_VAR}}={{.AWS_ACCESS_KEY}}' -X '{{.AWS_SECRET_ACCESS_KEY_VAR}}={{.AWS_SECRET_ACCESS_KEY}}'" ./cmd/autotester/
    silent: true

  run-suproxy:
    desc: "Run the project"
    deps: [generate-config-suproxy, di-generate-suproxy]
    env:
      APP_CMD: "./cmd/suproxy"
      OPENAI_KEY_VAR: "{{.OPENAI_KEY_VAR}}"
      VERSION_VAR: "{{.VERSION_VAR}}"
      AWS_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_ACCESS_KEY_ID --plain"
      AWS_SECRET_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_SECRET_ACCESS_KEY --plain"
    cmds:
      - "PATH=$LPATH; doppler run -- go tool air"

  run-autotester:
    desc: "Run the project"
    deps: [generate-config-autotester, di-generate-autotester]
    env:
      APP_CMD: "./cmd/autotester"
      OPENAI_KEY_VAR: "{{.OPENAI_KEY_VAR}}"
      VERSION_VAR: "{{.VERSION_VAR}}"
      AWS_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_ACCESS_KEY_ID --plain"
      AWS_SECRET_ACCESS_KEY:
        sh: "{{.BIN_PATH}}/doppler secrets get AWS_SECRET_ACCESS_KEY --plain"
    cmds:
      - task: build-frontend-dev
      - 'PATH=$LPATH; doppler run -- go tool air'

  compose-local:
    desc: "Run the whole project in docker-compose for local environment"
    dir: 'deployments'
    cmds:
      - docker login gitlab.dit.htwk-leipzig.de:5050
      - docker compose -f compose.dev.yml up -d

  compose-local-down:
    desc: "Stop all the containers in local environment"
    dir: 'deployments'
    cmds:
      - docker compose -f compose.dev.yml down

  test:
    desc: "Run the tests"
    cmds:
      - go tool gotestsum ./...
  
  test-coverage:
    desc: "Run the tests with coverage"
    cmds:
      - go tool gotestsum -- -coverprofile=coverage.out ./...

  test-coverage:
    desc: "Run the tests with coverage"
    vars:
      TESTCOVERAGE_THRESHOLD: 20 
    cmds:
      - echo "Running unit tests with coverage"
      - go tool gotestsum --junitfile junit.xml -- -coverprofile=coverage.out -covermode=count ./... 
      - go tool cover -func=coverage.out
      - go tool gocoverageplus --input=coverage.out -o go-cobertura-coverage.xml -v
      - echo "Quality Gate checking test coverage is above threshold"
      - echo "Threshold {{.TESTCOVERAGE_THRESHOLD}} %"
      - |
        totalCoverage=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
        echo "Current test coverage: $totalCoverage %"
        if (( $(echo "$totalCoverage {{.TESTCOVERAGE_THRESHOLD}}" | awk '{print ($1 > $2)}') )); then
            echo "Coverage check passed"
        else
            echo "Current test coverage is below threshold."
            exit 1
        fi

  test-integration:
    desc: "Run the integration tests"
    cmds:
      - go tool gotestsum -- -tags=integration ./...

  test-integration-coverage:
    desc: "Run the integration tests with coverage"
    cmds:
      - go tool gotestsum -- -tags=integration -- -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  lint:
    desc: "Run the lint"
    cmds:
      - go tool golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 --timeout=10m
    ignore_error: false

  static-analysis:
    desc: "Run static code analysis tools like gosec and staticcheck"
    vars:
      GOVERSION:
        sh: echo "go$(grep '^go ' go.mod | awk '{print $2}')"
      EXCLUDE_RULES: "G104,G107"
    cmds:
      - go tool staticcheck -tests=false ./cmd/... ./internal/...
      - GOSECGOVERSION={{.GOVERSION}} go tool gosec -exclude-dir="cmd/internal" -exclude={{.EXCLUDE_RULES}} -confidence medium -severity medium -nosec -exclude-generated -sort ./cmd/... ./internal/...

  lint-frontend:
    desc: "Run the frontend lint"
    cmds:
      - cd web/ && pnpm eslint .  

  format-frontend:
    desc: "Run the frontend formatter"
    cmds:
      - cd web/ && pnpm prettier --write .

  test-frontend:
    desc: "Run the frontend tests"
    dir: "web"
    cmds:
      - pnpm test

  pre-commit:
    desc: "Run the pre-commit"
    deps: [generate]
    cmds:
      - task: lint
      - task: test

  generate:
    desc: "generate code"
    cmds:
      - task: generate-config-autotester
      - task: generate-config-suproxy
      - task: generate-config-embedded
      - task: di-generate-autotester
      - task: di-generate-suproxy

  generate-config-autotester:
    desc: "generate code for reading autotester config"
    cmds:
      - PATH=$LPATH; go tool pkl-gen-go configs/autotester.pkl
    sources:
      - configs/autotester.pkl

  generate-config-suproxy:
    desc: "generate code for reading suproxy config"
    cmds:
      - PATH=$LPATH; go tool pkl-gen-go configs/suproxy.pkl
    sources:
      - configs/suproxy.pkl

  generate-mocks:
    desc: "generate all mockery mocks"
    cmds:
      - "go tool mockery"

  generate-config-embedded:
    desc: "generates the config in a binary format to use for embedding in compile time"
    cmds:
      - PATH=$LPATH; go run cmd/internal/generate-pkl-data/main.go
    sources:
    - configs/suproxy.pkl
    - configs/autotester.pkl
  
  di-generate-autotester:
    desc: "generate dependency injection code for autotester"
    cmds:
      - go tool wire ./cmd/autotester
    sources:
      - cmd/autotester/wire.go

  di-generate-suproxy:
    desc: "generate dependency injection code for suproxy"
    cmds:
      - go tool wire ./cmd/suproxy
    sources:
      - cmd/suproxy/wire.go