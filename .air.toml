root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app ${APP_CMD:-./cmd/suproxy}"
bin = "tmp/app"
full_bin = "./tmp/app"
include_ext = ["go"]
exclude_dir = ["assets", "tmp", "vendor", ".git", "node_modules"]
exclude_file = []
stop_on_error = true
send_interrupt = true
kill_delay = 1000 # ms

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
