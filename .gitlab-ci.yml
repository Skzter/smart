stages:
  - prepare
  - code_analysis_and_testing
  - build
  - deploy

variables:
  GO_VERSION: 1.24

default:
  image: golang:$GO_VERSION

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.go_cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  rules:
    - if: $GITLAB_CI == "false"
      when: never
    - when: on_success
  cache:
    key: $CI_COMMIT_REF_SLUG
    fallback_keys:
      - $CI_DEFAULT_BRANCH
    paths:
      - .go/pkg/mod/

go_mod_download:
  stage: prepare
  extends: .go_cache
  script:
    - ./bin/task setup

