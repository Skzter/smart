stages:
  - prepare
  - code_analysis_and_testing
  - llm_testing
  - build
  - deploy

variables:
  GO_VERSION: 1.24

default:
  tags:
    - fdit
  image:
    name: golang:$GO_VERSION

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.pnpm_cache:
  image:
    name: node:latest
  variables:
    PNPM_HOME: $CI_PROJECT_DIR/.pnpm-store
  rules:
    - if: $GITLAB_CI == "false"
      when: never
    - when: on_success
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir $PNPM_HOME
    - cd web
    - pnpm install
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store
      - node_modules

.go_cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  rules:
    - if: $GITLAB_CI == "false"
      when: never
    - when: on_success
  cache:
    key: $CI_COMMIT_REF_SLUG
    fallback_keys:
      - $CI_DEFAULT_BRANCH
    paths:
      - .go/pkg/mod/

go_mod_download:
  stage: prepare
  extends: .go_cache
  script:
    - go mod download

go_generate_code:
  stage: prepare
  extends: .go_cache
  script:
    - go tool task generate
  artifacts:
    name: Generated_Go_Code
    paths:
      - internal/autotester/domain/config
      - internal/suproxy/domain/config
      - internal/shared/domain/config
      - internal/build/configs
      - cmd/autotester/wire_gen.go
      - cmd/suproxy/wire_gen.go

replace_api_paths:
  # is needed to run the application on the HTWK Server -> reverse proxy routes / to /api
  stage: prepare
  image:
    name: alpine:latest
  script:
    # Router files - replace "/api/v1" with "/v1"
    - sed -i 's|"/api/v1"|"/v1"|g' internal/autotester/application/router.go
    - sed -i 's|"/api/v1"|"/v1"|g' internal/suproxy/application/router.go
    # Frontend API file - replace baseURL from "/api/v1/chat" to "/v1/chat"
    - sed -i 's|/api/v1|/v1|g' web/src/lib/Api.ts
    # Test files - replace all /api/v1/* routes with /v1/*
    - sed -i 's|/api/v1/userInfo|/v1/userInfo|g' internal/autotester/domain/handler/chat_test.go
    - sed -i 's|/api/v1/template|/v1/template|g' internal/autotester/domain/handler/template_test.go
    - sed -i 's|/api/v1/saveLocal|/v1/saveLocal|g' internal/autotester/domain/handler/localStorage_test.go
    - sed -i 's|/api/v1/deleteLocal|/v1/deleteLocal|g' internal/autotester/domain/handler/localStorage_test.go
    - sed -i 's|/api/v1/run|/v1/run|g' internal/autotester/domain/handler/runTest_test.go
    - sed -i 's|/api/v1/|/v1/|g' web/tests/unit/api.test.ts
    - sed -i 's|/api/v1/Offerlist|/v1/Offerlist|g' internal/suproxy/domain/handler/handler_test.go
    - sed -i 's|"/api/v1"|"/v1"|g' internal/suproxy/domain/handler/handler_test.go
  artifacts:
    name: Modified_Files
    paths:
      - internal/autotester/application/router.go
      - internal/suproxy/application/router.go
      - web/src/lib/Api.ts
      - internal/autotester/domain/handler/chat_test.go
      - internal/autotester/domain/handler/template_test.go
      - internal/autotester/domain/handler/localStorage_test.go
      - internal/autotester/domain/handler/runTest_test.go
      - web/tests/unit/api.test.ts
      - internal/suproxy/domain/handler/handler_test.go

lint_frontend:
  stage: code_analysis_and_testing
  extends: .pnpm_cache
  script:
    - pnpm eslint .

lint_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - go tool task lint

static_analysis_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - go tool task static-analysis
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

sonarqube-check:
  stage: code_analysis_and_testing
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  needs:
    - integration_test_go
    - frontend_test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

unit_test_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - go tool task test
  rules:
    - if: $CI_COMMIT_BRANCH != "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

integration_test_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - go tool task test-ci
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    name: go_coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./go-cobertura-coverage.xml
      junit: junit.xml
    paths:
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

frontend_test:
  stage: code_analysis_and_testing
  extends: .pnpm_cache
  needs:
    - job: replace_api_paths
      artifacts: true
  script:
    - pnpm run test:coverage
  coverage: '/All files\s*\|\s*(\d+)\s*\|\s*(\d+)\s*\|\s*(\d+)\s*\|\s*(\d+)\s*\|/'
  artifacts:
    name: frontend_coverage
    paths:
      - web/coverage/lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: web/coverage/cobertura-coverage.xml
      junit: web/coverage/junit.xml

llm_test_suite:
  stage: llm_testing
  script:
    - echo "Running LLM test suite..."
    - ./bin/doppler run -- go test -tags=llmtest -run TestPromptTestSuite ./internal/autotester/domain/service -v
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

build_frontend_artifacts:
  stage: build
  extends: .pnpm_cache
  needs:
    - job: replace_api_paths
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  script:
    - pnpm build
  artifacts:
    name: Frontend_Build
    paths:
      - web/dist/

build_frontend_no_artifacts:
  stage: build
  extends: .pnpm_cache
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: on_success
  script:
    - pnpm build

build_go_artifacts:
  stage: build
  extends: .go_cache
  needs:
    - job: build_frontend_artifacts
      artifacts: true
    - job: go_generate_code
      artifacts: true
    - job: replace_api_paths
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  script:
    - go tool task build-pipeline
  artifacts:
    name: Go_Bin
    paths:
      - build/

build_go_no_artifacts:
  stage: build
  extends: .go_cache
  needs:
    - job: go_generate_code
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: on_success
  script:
    - go tool task build-pipeline

.docker_build:
  image:
    name: docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

build_suproxy_go_container:
  stage: build
  extends: .docker_build
  interruptible: true
  needs:
    - job: build_go_artifacts
      artifacts: true
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/suproxy:latest
  script:
    - docker build -f deployments/suproxy/Dockerfile.prod -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

build_autotester_go_container:
  stage: build
  extends: .docker_build
  interruptible: true
  needs:
    - job: build_go_artifacts
      artifacts: true
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/autotester:latest
  script:
    - docker build -f deployments/autotester/Dockerfile.prod -t $IMAGE_TAG --build-arg DOPPLER_TOKEN=$DOPPLER_TOKEN .
    - docker push $IMAGE_TAG

build_autotester_run_container:
  stage: build
  extends:
    - .docker_build
    - .go_cache
  interruptible: true
  needs:
    - job: go_generate_code
      artifacts: true
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/auto-playwright:latest
    DOCKER_BUILDKIT: 1
  script:
    - |
      echo "$CI_JOB_TOKEN" | docker build \
        --secret id=git_credentials,src=/dev/stdin \
        -f build/auto-playwright/Dockerfile \
        -t $IMAGE_TAG \
        .
    - docker push $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true

deploy_htwk:
  image:
    name: alpine:latest
  stage: deploy
  tags:
    - image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  interruptible: true
  resource_group: production
  script:
    - apk add --no-cache openssh sshpass
    - mkdir -p ~/.ssh
    - echo "$SSH_PASSWORD" > ~/.ssh/ssh_password.txt
    - chmod 600 ~/.ssh/ssh_password.txt
    - ssh-keyscan -H $HTWK_IP >> ~/.ssh/known_hosts
    - sshpass -f ~/.ssh/ssh_password.txt scp deployments/compose.prod.yml stud@$HTWK_IP:/home/stud
    - sshpass -f ~/.ssh/ssh_password.txt scp -r deployments/nginx stud@$HTWK_IP:/home/stud
    - sshpass -f ~/.ssh/ssh_password.txt ssh stud@$HTWK_IP "
      export CI_REGISTRY_USER=$CI_REGISTRY_USER;
      export CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD;
      export CI_REGISTRY=$CI_REGISTRY;
      echo "DD_API_KEY={$DATADOG_KEY}" >> ~/.env;
      echo \$CI_REGISTRY_PASSWORD | podman login \$CI_REGISTRY -u \$CI_REGISTRY_USER --password-stdin &&
      podman pull gitlab.dit.htwk-leipzig.de:5050/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart/auto-playwright:latest &&
      podman-compose -f compose.prod.yml pull &&
      podman-compose -f compose.prod.yml down &&
      podman-compose -f compose.prod.yml up -d --remove-orphans &&
      podman image prune -f
      "
