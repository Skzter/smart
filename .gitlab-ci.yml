stages:
  - prepare
  - code_analysis_and_testing
  - build
  - deploy

variables:
  GO_VERSION: 1.24

default:
  image: golang:$GO_VERSION

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.pnpm_cache:
  image: node:latest
  variables:
    PNPM_HOME: $CI_PROJECT_DIR/.pnpm-store
  rules:
    - if: $GITLAB_CI == "false"
      when: never
    - when: on_success
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_HOME
    - cd web
    - pnpm install
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .pnpm-store
      - node_modules

.go_cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  rules:
    - if: $GITLAB_CI == "false"
      when: never
    - when: on_success
  cache:
    key: $CI_COMMIT_REF_SLUG
    fallback_keys:
      - $CI_DEFAULT_BRANCH
    paths:
      - .go/pkg/mod/

go_mod_download:
  stage: prepare
  extends: .go_cache 
  script:
    - go mod download

generate_config:
  stage: prepare
  extends: .go_cache 
  script:
    - ./bin/task generate-config
  artifacts:
    name: Generated_Configs
    paths:
      - internal/autotester/domain/config
      - internal/suproxy/domain/config

lint_frontend:
  stage: code_analysis_and_testing
  extends: .pnpm_cache
  script:
    - pnpm eslint .

lint_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - ./bin/task lint

static_analysis_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - ./bin/task static-analysis
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success

sonarqube-check:
  stage: code_analysis_and_testing
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

unit_test_go:
  stage: code_analysis_and_testing
  extends: .go_cache
  script:
    - apt-get update && apt-get install -y bc
    - ./bin/task test
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - smart/coverage.out
      - smart/coverage.html
    expire_in: 1 week

build_frontend_artifacts:
  stage: build
  extends: .pnpm_cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  script:
    - pnpm build
  artifacts:
    name: Frontend_Build
    paths:
      - web/dist/

build_frontend_no_artifacts:
  stage: build
  extends: .pnpm_cache
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: on_success
  script:
    - pnpm build

build_go_artifacts:
  stage: build
  extends: .go_cache
  needs:
    - job: build_frontend_artifacts
      artifacts: true
    - job: generate_config
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  script:
    - ./bin/task build-pipeline
  artifacts:
    name: Go_Bin
    paths:
      - build/

build_go_no_artifacts:
  stage: build
  extends: .go_cache
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: on_success
  script:
    - ./bin/task build-pipeline

.docker_build:
  image: docker:dind
  tags:
    - fdit
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

build_suproxy_go_container:
  stage: build
  extends: .docker_build
  interruptible: true
  needs:
    - job: build_go_artifacts
      artifacts: true
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/suproxy:latest
  script:
    - docker build -f deployments/suproxy/Dockerfile.prod -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

build_autotester_go_container:
  stage: build
  extends: .docker_build
  interruptible: true
  needs:
    - job: build_go_artifacts
      artifacts: true
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/autotester:latest
  script:
    - docker build -f deployments/autotester/Dockerfile.prod -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

deploy_htwk:
  image: alpine:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  interruptible: true
  resource_group: production
  script:
    - apk add --no-cache openssh sshpass
    - mkdir -p ~/.ssh
    - echo "$SSH_PASSWORD" > ~/.ssh/ssh_password.txt
    - chmod 600 ~/.ssh/ssh_password.txt
    - ssh-keyscan -H $HTWK_IP >> ~/.ssh/known_hosts
    - sshpass -f ~/.ssh/ssh_password.txt scp deployments/compose.prod.yml stud@$HTWK_IP:/home/stud
    - sshpass -f ~/.ssh/ssh_password.txt ssh stud@$HTWK_IP "
        export CI_REGISTRY_USER=$CI_REGISTRY_USER;
        export CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD;
        export CI_REGISTRY=$CI_REGISTRY;
        echo \$CI_REGISTRY_PASSWORD | podman login \$CI_REGISTRY -u \$CI_REGISTRY_USER --password-stdin &&
        podman-compose -f compose.prod.yml pull &&
        podman-compose -f compose.prod.yml down &&
        podman-compose -f compose.prod.yml up -d --remove-orphans && 
        podman image prune -f
      "
