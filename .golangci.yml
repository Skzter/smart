version: "2"
output:
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - lll
    - makezero
    - prealloc
    - staticcheck
    - unparam
    - unused
    - whitespace
