services:
  suproxy:
    build:
      context: ..
      dockerfile: deployments/suproxy/Dockerfile.dev
    working_dir: /app
    command: ["dev-entrypoint.sh"]
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8080:8080"
    networks:
      - default
    environment:
      - APP_CMD=./cmd/suproxy
      - VERSION=dev
      - VERSION_VAR=gitlab.dit.htwk-leipzig.de/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart/internal/build.Version
      - OPENAI_KEY_VAR=gitlab.dit.htwk-leipzig.de/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart/internal/build.OpenAIKey
      - OPENAI_KEY=${OPENAI_KEY}
      - DOPPLER_PROJECT=${DOPPLER_PROJECT:-htwk-projekt}
      - DOPPLER_CONFIG=${DOPPLER_CONFIG:-dev}
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      - DD_AGENT_HOST=datadog
      - DD_TRACE_AGENT_PORT=8126
      - DD_DOGSTATSD_PORT=8125
      - DD_SITE=us5.datadoghq.com

  autotester:
    build:
      context: ..
      dockerfile: deployments/autotester/Dockerfile.dev
    working_dir: /app
    command: ["dev-entrypoint.sh"]
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8081:8081"
    networks:
      - default
    environment:
      - APP_CMD=./cmd/autotester
      - VERSION=dev
      - VERSION_VAR=gitlab.dit.htwk-leipzig.de/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart/internal/build.Version
      - OPENAI_KEY_VAR=gitlab.dit.htwk-leipzig.de/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/smart/internal/build.OpenAIKey
      - OPENAI_KEY=${OPENAI_KEY}
      - DOPPLER_PROJECT=${DOPPLER_PROJECT:-htwk-projekt}
      - DOPPLER_CONFIG=${DOPPLER_CONFIG:-dev}
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      - DD_AGENT_HOST=datadog
      - DD_TRACE_AGENT_PORT=8126
      - DD_SITE=us5.datadoghq.com

  autotester-mcp:
    build:
      context: ..
      dockerfile: deployments/mcp/Dockerfile.dev
    ports:
      - "8084:8084"
    networks:
      - default
    environment:
      - AUTOTESTER_BASE_URL=http://autotester:8081
      - DD_AGENT_HOST=datadog
      - DD_TRACE_AGENT_PORT=8126
      - DD_SITE=us5.datadoghq.com    

  frontend-mock:
    platform: linux/amd64
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/frontend-mock
    networks:
      - default
    ports:
      - "8082:8082"
    environment:
      - SUPPLIER_URL=http://supplier-mock:8083/api/v1
      - API_URL=http://suproxy:8080/api/v1
      - NODE_ENV=development

  supplier-mock:
    platform: linux/amd64
    image: gitlab.dit.htwk-leipzig.de:5050/projekt2025-w-llm-unterstuetztes-autotesting-fuer-moderne-web-frontends/supplier-mock
    networks:
      - default
    ports:
      - "8083:8083"

  redis:
    image: valkey/valkey:alpine
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./valkey.conf:/etc/valkey/valkey.conf
    networks:
      - default
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:17-alpine
    #depends_on:
    #  - autotester
    networks:
      - default
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres-pass
      - POSTGRES_DB=smart

  datadog:
    image: datadog/agent:latest
    networks:
      - default
    ports:
      - 8126:8126/tcp
      - 8125:8125/udp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/datadog:/var/run/datadog
      - /opt/datadog-agent/run:/opt/datadog-agent/run:rw
    environment:
      - DD_API_KEY=${DATADOG_KEY}
      - DD_HOSTNAME=dev-container
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_USE_DOGSTATSD=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_SITE=us5.datadoghq.com
      - DD_APM_RECEIVER_SOCKET=/var/run/datadog/apm.socket
      - DD_DOGSTATSD_SOCKET=/var/run/datadog/dsd.socket
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_AUTO_MULTI_LINE_DETECTION=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS="name:dd-agent"

volumes:
  go-mod-cache:
  go-build-cache:
