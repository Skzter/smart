server {
	listen 80;
	listen 8081;
	server_name _;

	# Restrict auth token generation to internal networks only
	location /api/v1/auth/generate {
		allow 127.0.0.1;
		allow ::1;
		allow 172.16.0.0/12;  # Docker default bridge networks
		allow 192.168.0.0/16; # Docker Compose internal networks
		deny all;

		proxy_pass http://autotester:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

    	location / {
        	proxy_pass http://autotester:8081;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
   	 }
}