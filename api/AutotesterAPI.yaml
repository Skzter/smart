openapi: 3.0.0
info:
  title: "Autotester API"
  description: api for the connection from frontend to backend.
  version: 1.0.0
paths:
  /v1/chat:
    post:
      summary: "Takes user message and returns LLMs message."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful processing of the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /v1/userInfo:
    post:
      summary: "Requests User Info from Backend on inital load"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
        
      responses:
        '200':
          description: Successful Request for user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/saveLocal:
    post:
      summary: "Takes a testcode and saves it locally"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavaLocalRequest'

      responses:
        '200':
          description: The test case was successfully saved locally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseActionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/v1/deleteLocal:
    post:
      summary: "Deletes a locally stored test case by its ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteLocalRequest'
        
      responses:
        '200':
          description: Successfully deleted the locally stored test case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseActionResponse'
              examples:
                deletedExample:
                  summary: "Deleted test case"
                  value:
                    testcaseId: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
                    action: "deleted"

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  schemas:
    Message:
      type: object
      properties:
        data:
          type: string
        agent:
          type: string 
          enum: [user, system]
          
    Conversation:
      type: object
      properties:
        conversationId:
          type: string
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    UserRequest:
      type: object
      properties:
        userId:
          type: string
          
    UserResponse:
      type: object
      properties:
        userId:
          type: string
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        allConversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
          
    ChatRequest:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        userId:
          type: string
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        conversationId:
          type: string
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"

    ChatResponse:
      type: object
      properties:
        content:
          type: object
          properties:
            message:
              $ref: '#/components/schemas/Message'
            userId:
              type: string
              example: "9177b856-46a0-11f0-9fe2-0242ac120002"
            conversationId:
              type: string
              example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        tool_calls:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              arguments:
                type: object
                additionalProperties: true
    
    SavaLocalRequest:
      type: object
      required:
        - userId
        - conversationId
        - code
      properties:
        userId:
          type: string
          description: "ID of the user saving the test case."
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        conversationId:
          type: string
          description: "ID of the conversation the test case belongs to."
          example: "2f68cb52-47b0-11f0-bd5b-0242ac120002"
        code:
          type: string
          description: "Source code of the test case provided by the frontend."
          example: |
            import { test, expect } from '@playwright/test';

            test('should successfully log in', async ({ page }) => {
              await page.goto('https://example.com/login');
              await page.fill('#username', 'user');
              await page.fill('#password', 'pass');
              await page.click('button[type="submit"]');
              await expect(page).toHaveURL('https://example.com/dashboard');
            });

    DeleteLocalRequest:
      type: object
      properties:
        testcaseId:
          type: string
          description: "Unique identifier of the test case to be deleted."
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
        userId:
          type: string
          description: "ID of the user saving the test case."
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        conversationId:
          type: string
          description: "ID of the conversation the test case belongs to."
          example: "2f68cb52-47b0-11f0-bd5b-0242ac120002"
        
    TestCaseActionResponse:
      type: object
      properties:
        testcaseId:
          type: string
          description: "Unique identifier of the affected test case."
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
        action:
          type: string
          enum: [saved, deleted]
          description: "Indicates whether the test case was saved or deleted."

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "An error occurred while processing the request."
