openapi: 3.0.0
info:
  title: "Autotester API"
  description: api for the connection from frontend to backend.
  version: 1.0.0
paths:
  /api/v1/chat:
    post:
      summary: "Takes user message and returns LLMs message."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful processing of the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                
  /api/v1/validate:
    post:
      summary: "Validates a prompt with user/chat context"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Validation result wrapped in ResponseForUser
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      body:
                        type: string
                  userId:
                    type: string
                  chatId:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'  
                             
  /api/v1/userInfo:
    post:
      summary: "Requests User Info from Backend on inital load"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
        
      responses:
        '200':
          description: Successful Request for user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
 
  /api/v1/template:
    get:
      summary: "Gets Template from Autotester Config and returns it"
      responses:
        '200':
          description: Template from config is not empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '500':
          description: Template from config is empty
          content:
            text/plain:
              schema:
                type: string
                example: ""

  /api/v1/saveLocal:
    post:
      summary: "Takes a testcode and saves it locally"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavaLocalRequest'

      responses:
        '200':
          description: The test case was successfully saved locally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseActionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/v1/deleteLocal:
    delete:
      summary: "Deletes a locally stored test case by its ID"
      parameters:
        - name: testcaseId
          in: query
          required: true
          schema:
            type: string
          description: "Unique identifier of the test case to be deleted."
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: "ID of the user deleting the test case."
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        - name: conversationId
          in: query
          required: true
          schema:
            type: string
          description: "ID of the conversation the test case belongs to."
          example: "2f68cb52-47b0-11f0-bd5b-0242ac120002"
        
      responses:
        '200':
          description: Successfully deleted the locally stored test case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseActionResponse'
              examples:
                deletedExample:
                  summary: "Deleted test case"
                  value:
                    testcaseId: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
                    action: "deleted"

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                
  /api/v1/run:
      post:
        summary: Run automated Playwright test in container
        description: Executes a Playwright test file in a containerized environment and returns the test output logs
        tags:
          - Autotester
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - testId
                  - sessionId
                properties:
                  userId:
                    type: string
                    description: Unique identifier of the user
                    example: "user123"
                  testId:
                    type: string
                    description: Unique identifier of the test to run
                    example: "test456"
                  sessionId:
                    type: string
                    description: Unique identifier of the session
                    example: "session789"
        responses:
          '200':
            description: Test executed successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    result:
                      type: string
                      description: Test execution output logs
                      example: "Test passed: All assertions successful"
          '400':
            description: Bad request - Invalid input or missing required parameters
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                      description: Error message describing the issue
                      example: "Missing required parameters"
          '500':
            description: Internal server error - Command execution or file reading failed
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                      description: Error message describing the internal error
                      example: "Command execution error: exit status 1"
  /api/v1/users/{userId}/chats:
    get:
      summary: "Returns the chat history for a specific user"
      description: |
        Retrieves all chat summaries associated with the given `userId`.

        An optional `limit` query parameter can be provided to restrict how many
        of the most recently updated chats are returned.  
        - If `limit` is omitted or set to `0`, all chats are returned.  
        - Chats are sorted by `updatedAt` descending.
      parameters:
        - name: userId
          in: path
          required: true
          description: "Unique identifier of the user."
          schema:
            type: string
          example: "auth0|687270280dca20b77cfdcf74"

        - name: limit
          in: query
          required: false
          description: "Maximum number of chat summaries to return. Must be 0 or a positive integer."
          schema:
            type: integer
            minimum: 0
          example: 10

      responses:
        '200':
          description: "Successfully returned the chat summaries for the user."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSummarys'

        '400':
          description: "Bad request — invalid userId or invalid limit parameter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: "Internal server error — failed to load chat history."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{userId}/chats/{chatId}:
    get:
      summary: Get full chat by ID
      description: |
        Returns a full chat (conversation) for the given user, including all messages.
      parameters:
        - in: path
          name: userId
          required: true
          description: "Unique identifier of the user who owns the chat."
          schema:
            type: string
        - in: path
          name: chatId
          required: true
          description: "Unique identifier of the chat to retrieve."
          schema:
            type: string
      responses:
        '200':
          description: Full chat with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tests:
    get:
      summary: Retrieve stored test cases with optional filters
      description: >
        Returns test cases belonging to the specified user. Additional optional
        query parameters can be used to filter for specific test cases, conversations,
        or by creation timestamps.
      parameters:
        - name: author
          in: query
          schema:
            type: string
          description:  >
            Optional: Filters results by a specific user ID. 
            Can be combined with other filters. 
          example: "687385280dca20b77cfdcf74"

        - name: testcaseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Optional: Filters results by a specific test case ID. 
            Can be combined with other filters. 
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"

        - name: createdAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Optional: Returns test cases created strictly after the provided
            ISO 8601 timestamp. Can be combined with `createdBefore` to define
            a date range.
          example: "2025-01-01T00:00:00Z"

        - name: createdBefore
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Optional: Returns test cases created strictly before the provided
            ISO 8601 timestamp. Can be combined with `createdAfter` to define
            a date range.
          example: "2025-12-31T23:59:59Z"

        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
          description: >
            Optional: Limits the maximum number of returned test cases.
            Default is 50.
          example: 50

        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >
            Optional: Number of results to skip before returning data.
            Default is 0.
          example: 0
            
      responses:
        '200':
          description: Successfully returned the filtered testcase metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                   $ref: '#/components/schemas/TestcaseMetadata'

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Message:
      type: object
      properties:
        id:
          type: string
        body:
          type: string
        role:
          type: string 
          enum: [user, system]
        createdAt:
          type: "number"
          
    Conversation:
      type: object
      properties:
        conversationId:
          type: string
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    UserRequest:
      type: object
      properties:
        userId:
          type: string
          
    UserResponse:
      type: object
      properties:
        userId:
          type: string
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        allConversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'

    Chat:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier of the chat."
        userId:
          type: string
          description: "ID of the user who owns the chat."
        createdAt:
          type: string
          format: date-time
          description: "Timestamp when the chat was created."
        updatedAt:
          type: string
          format: date-time
          description: "Timestamp when the chat was last updated."
        title:
          type: string
          description: "Human-readable title of the chat."
        messages:
          type: array
          description: "List of all messages in this chat."
          items:
            $ref: '#/components/schemas/Message'
        lastTest:
          type: string
          nullable: true
          description: "Information about the last executed test (if any)."
        systemPrompt:
          type: string
          nullable: true
          description: "System prompt used for this chat (if any)."
        initialPrompt:
          type: string
          nullable: true
          description: "Initial prompt that started this chat (if any)."
      required:
        - id
        - userId
        - createdAt
        - updatedAt
        - title
        - messages
      
    ChatRequest:
      type: object
      properties:
        prompt:
          type: string
          example: "generate something"
        userId:
          type: string
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        conversationId:
          type: string
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"

    ChatResponse:
      type: object
      properties:
        content:
          type: object
          properties:
            message:
              $ref: '#/components/schemas/Message'
            userId:
              type: string
              example: "9177b856-46a0-11f0-9fe2-0242ac120002"
            conversationId:
              type: string
              example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        tool_calls:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              arguments:
                type: object
                additionalProperties: true
    
    SavaLocalRequest:
      type: object
      required:
        - userId
        - conversationId
        - code
      properties:
        userId:
          type: string
          description: "ID of the user saving the test case."
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        conversationId:
          type: string
          description: "ID of the conversation the test case belongs to."
          example: "2f68cb52-47b0-11f0-bd5b-0242ac120002"
        code:
          type: string
          description: "Source code of the test case provided by the frontend."
          example: |
            import { test, expect } from '@playwright/test';

            test('should successfully log in', async ({ page }) => {
              await page.goto('https://example.com/login');
              await page.fill('#username', 'user');
              await page.fill('#password', 'pass');
              await page.click('button[type="submit"]');
              await expect(page).toHaveURL('https://example.com/dashboard');
            });

    DeleteLocalRequest:
      type: object
      properties:
        testcaseId:
          type: string
          description: "Unique identifier of the test case to be deleted."
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
        userId:
          type: string
          description: "ID of the user saving the test case."
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        conversationId:
          type: string
          description: "ID of the conversation the test case belongs to."
          example: "2f68cb52-47b0-11f0-bd5b-0242ac120002"
        
    TestCaseActionResponse:
      type: object
      properties:
        testcaseId:
          type: string
          description: "Unique identifier of the affected test case."
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
        action:
          type: string
          enum: [saved, deleted]
          description: "Indicates whether the test case was saved or deleted."

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "An error occurred while processing the request."

    Template:
      type: object
      properties:
        template:
          type: string
          example: "Config: Base Url: {{url}}, Scenario: {{ scenario }}, ..."
    ChatSummarys:
      type: object
      properties:
        chatSummarys:
          type: array
          items:
            $ref: '#/components/schemas/ChatSummary'

    ChatSummary:
      type: object
      properties:
        chatId:
          type: string
          example: "2f68cb52-47b0-11f0-bd5b-0242ac120002"
        userId:
          type: string
          example: "auth0|687270280dca20b77cfdcf74"
        title:
          type: string
          example: "Login Test Conversation"
        createdAt:
          type: string
          format: date-time
          example: "2025-01-15T10:24:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-22T09:12:45Z"
        messageCount:
          type: integer
          example: 14

    TestcaseMetadata:
      type: object
      properties:
        key:
          type: string
          description: "Unique key for loading the test case from storage. Format: testcase/<testcaseId>_<created>.parquet"
          example: "testcase/bdf1e5b4-47c2-11f0-b8a3-0242ac120002_1701456000.parquet"
        testcaseId:
          type: string
          format: uuid
          description: "UUID of the testcase."
          example: "bdf1e5b4-47c2-11f0-b8a3-0242ac120002"
        author:
          type: string
          format: uuid
          description: "UUID of the user who created the test case."
          example: "9177b856-46a0-11f0-9fe2-0242ac120002"
        created:
          type: string
          description: "Creation timestamp as Unix time."
          example: "1701456000"
        updated:
          type: string
          description: "Last update timestamp as Unix time."
          example: "1701460000"
        name:
          type: string
          description: "Descriptive name of the test case."
          example: "Login form test"
